# Public name: Landmark. Free plan only (see RELEASE-GATES "Billing safety"): Workers Free,
# SQLite-backed Durable Objects, D1 and static assets; nothing here needs a payment method.
name = "landmark"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Public (non-secret) config. GOOGLE_CLIENT_SECRET and SESSION_SECRET are
# secrets — set via `.dev.vars` locally / `wrangler secret put` in deployment —
# and are intentionally NOT vars (a var/secret name clash is rejected).
[vars]
GOOGLE_CLIENT_ID = "510130447002-l8pgtjl4nau054tfao7go633p84n6s96.apps.googleusercontent.com"

# RUNTIME-E1 §1: one origin. The built web app is served as static assets; only
# the dynamic routes reach the Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# DATA-001 identity. Create the database once with `wrangler d1 create moneygame`
# and put its id here; apply schema with `wrangler d1 migrations apply moneygame --remote`.
[[d1_databases]]
binding = "DB"
database_name = "moneygame"
database_id = "19e66656-9be2-4fc0-ae34-50bff45efce2"
migrations_dir = "migrations"

# RT-001: one SQLite-backed GameRoom Durable Object per room code (reused across rematches).
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SPIKE-003: one SQLite-backed Durable Object holding OAuth transaction state.
[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "AuthStore"

# Durable Object classes (SQLite-backed, the only kind the Free plan allows). The `landmark`
# Worker starts with this single migration; the spike-era history (SpikeRoom v1-v4) belonged to the
# retired `moneygame-worker` script and is not replayed here.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthStore", "GameRoom"]
